name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      # Fully offline: tests build a synthetic Financial Statement Data Set
      # zip in the exact SEC layout and run every model, query and
      # assertion against it. CI never contacts sec.gov.
      - run: pytest
